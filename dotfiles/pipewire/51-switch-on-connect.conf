# SND-B5 (a pipewire-pulse.conf.d drop-in): a Bluetooth headset that
# connects becomes the output, even after an output was picked by hand.
# Picking one (Sound card, pavucontrol: `wpctl set-default`) makes it
# WirePlumber's configured default, which outranks every priority
# (default-nodes/find-selected-default-node.lua: 30000 + its priority), so a
# headset that connected later stayed silent. This module makes the newly
# connected output the configured default instead; once it goes, WirePlumber
# falls back to the output picked before it (default-nodes/
# state-default-nodes.lua). The blocklist (a regex on node.name) leaves out
# every ALSA device (the laptop's own, a dock, USB) and every Bluetooth
# microphone, which would switch the headset to call mode (SND-B3): only
# Bluetooth outputs take over.
pulse.cmd = [
  { cmd = "load-module" args = "module-switch-on-connect blocklist=^(alsa_|bluez_input)" flags = [ ] }
]
