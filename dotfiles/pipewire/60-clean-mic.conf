# SND-I10 (a pipewire.conf.d drop-in): a clean microphone for calls and
# recordings, from PipeWire's own WebRTC audio processing (libspa-aec-webrtc
# ships with pipewire: no package, no daemon). It is one more input, "Clean
# mic", next to the real ones: the Sound card and every app's device menu
# offer it, and an app hears it only once it is picked there.
#
# Off unless picked. It never becomes the default input by itself: every
# real microphone outranks its priority.session 0 (ALSA's start at about
# 1100, a Bluetooth headset's is 1000, wireplumber/51-sound.conf). And it
# opens the microphone only while something records from it: its capture
# stream is passive, so the microphone stays suspended while the clean mic
# idles, and so does the processing. (Lab, a private PipeWire 1.6.9 with
# this file: music playing and nothing recording costs what it costs
# without it, 0.1-0.2 % of a core, the microphone suspended.) While an app
# records from it, the processing takes about 2-5 % of a core.
#
# What it takes out: steady noise (fans, hum, some of a keyboard) and
# rumble under about 80 Hz (the high-pass filter). Gain control stays off:
# browsers run their own, and two in a row pump the level. Mono: one
# channel carries a voice, and WebRTC works on every channel it gets.
#
# No echo cancelling, though the module is an echo canceller: its echo
# reference would be what the speakers play, and taking that from the
# output (monitor.mode) runs the microphone and the processing whenever
# anything plays, as PipeWire schedules the module's streams together and
# the module processes only when they all run. (Lab, music only, nothing
# recording: the microphone running, the daemon at 3.5 % of a core instead
# of 0.1 %, the speaker woken eight times as often, and a recording stream
# the privacy pill would show.) So its reference is the module's own sink,
# kept out of every output list (a class no app lists) and linked to
# nothing, as is its playback: silence, which the canceller passes as is.
# Calls in the browser cancel echo themselves.
#
# node.latency 1024/48000: WebRTC works in 20 ms blocks (10 ms more delay
# than its own size), and the passive capture never pulls the microphone
# below PipeWire's default quantum, 1024, while another app records from
# it; at the module's 10 ms (lab) a recorder asking for 100 ms got 256
# instead of 2048, eight times the wakeups.
#
# It cleans whichever microphone WirePlumber links its capture stream to:
# the default input, or, while the clean mic itself is the default, the
# best real microphone (WirePlumber never links a filter to itself).
context.modules = [
  { name = libpipewire-module-echo-cancel
    args = {
      library.name = aec/libspa-aec-webrtc
      monitor.mode = false
      node.latency = 1024/48000
      audio.channels = 1
      audio.position = [ MONO ]
      aec.args = {
        webrtc.noise_suppression = true
        webrtc.high_pass_filter = true
        webrtc.gain_control = false
      }
      capture.props = {
        node.name = "clean-mic.capture"
        node.description = "Clean mic: microphone"
        node.passive = true
      }
      source.props = {
        node.name = "clean-mic"
        node.nick = "Clean mic"
        node.description = "Clean mic (less noise)"
        priority.session = 0
      }
      sink.props = {
        node.name = "clean-mic.reference"
        node.description = "Clean mic: echo reference (unused)"
        media.class = "Audio/Sink/Internal"
      }
      playback.props = {
        node.name = "clean-mic.reference-out"
        node.description = "Clean mic: echo reference out (unused)"
        media.class = "Stream/Output/Audio/Internal"
        node.autoconnect = false
        node.passive = true
      }
    }
  }
]
