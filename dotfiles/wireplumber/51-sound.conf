# Sound fixes for WirePlumber 0.5 (a wireplumber.conf.d drop-in).

# SND-B3: a Bluetooth headset's microphone must not become the default input
# by itself. With bluetooth.autoswitch-to-headset-profile on (the default),
# WirePlumber offers a headset's microphone as a loopback source whose
# priority.session is 2010 (scripts/monitors/bluez/create-loopback-node.lua),
# above every built-in microphone (the laptop's: 1680). Once it was the
# default, any app that records switched the headset to its call profile:
# mono, narrow-band sound, with nothing to say why. The loopback is a
# PipeWire stream inside WirePlumber, so PipeWire's stream.rules reach it.
# At 1000 it ranks below every ALSA input (scripts/monitors/alsa.lua ranks
# those from about 1100 up), so it is the default input only when it is the
# only microphone, or when picked by hand. WirePlumber's choice uses the new
# value (with WIREPLUMBER_DEBUG=s-default-nodes:5 it logs "considering
# bluez_input...: prio 1000"), though `wpctl inspect` still lists 2010.
stream.rules = [
  {
    matches = [ { node.name = "~bluez_input.*", bluez5.loopback = "true" } ]
    actions = { update-props = { priority.session = 1000 } }
  }
]

# SND-B7: the laptop codec's endpoints by the short names the Sound card
# already shows (their node.nick), instead of "Core Ultra 200H/200V Series
# Processors HD Audio Speaker": node.description is what Waybar's sound
# tooltip, pavucontrol and swaync's volume widget show. The names match only
# this laptop's SoundWire codec (sof_sdw), so the desktop PC keeps its own.
# Speaker and Microphones make up one profile, Headphones and the headset's
# microphone the profiles WirePlumber switches to on the jack, and the three
# HDMI / DisplayPort outputs are in all of them.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*sof_sdw.HiFi__Speaker__sink" } ]
    actions = { update-props = { node.description = "Speaker" } }
  }
  {
    matches = [ { node.name = "~alsa_output.*sof_sdw.HiFi__Headphones__sink" } ]
    actions = { update-props = { node.description = "Headphones" } }
  }
  {
    matches = [ { node.name = "~alsa_output.*sof_sdw.HiFi__HDMI1__sink" } ]
    actions = { update-props = { node.description = "HDMI / DisplayPort 1 Output" } }
  }
  {
    matches = [ { node.name = "~alsa_output.*sof_sdw.HiFi__HDMI2__sink" } ]
    actions = { update-props = { node.description = "HDMI / DisplayPort 2 Output" } }
  }
  {
    matches = [ { node.name = "~alsa_output.*sof_sdw.HiFi__HDMI3__sink" } ]
    actions = { update-props = { node.description = "HDMI / DisplayPort 3 Output" } }
  }
  {
    matches = [ { node.name = "~alsa_input.*sof_sdw.HiFi__Mic__source" } ]
    actions = { update-props = { node.description = "Microphones" } }
  }
  {
    matches = [ { node.name = "~alsa_input.*sof_sdw.HiFi__Headset__source" } ]
    actions = { update-props = { node.description = "Headset Microphone" } }
  }
]
